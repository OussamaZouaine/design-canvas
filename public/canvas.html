<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Canvas</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a id="back" href="/" title="All projects">← Projects</a>
    <!-- The project name is an input so it can be renamed in place -->
    <input id="pname" aria-label="Project name" maxlength="80" spellcheck="false" />
    <span id="count"></span>
    <!-- Pages: separate canvases inside the project. Only the active page's artboards are shown. -->
    <span class="pagebar">
      <select id="page" aria-label="Page"></select>
      <button id="page-add" class="icon" title="Add a page" aria-label="Add a page">+</button>
      <button id="page-rename" class="icon" title="Rename this page" aria-label="Rename this page">✎</button>
      <button id="page-del" class="icon" title="Delete this page (its boards move to another page)" aria-label="Delete this page">✕</button>
    </span>
    <span class="sep"></span>
    <button id="open-layers" aria-pressed="false" title="Layer tree (L)">Layers</button>
    <button id="open-design" title="Edit the selected layer (I)">Design</button>
    <button id="new">+ Artboard</button>
    <button id="fit">Fit</button>
    <span id="zoom">100%</span>
    <span class="grow"></span>
    <button id="follow" aria-pressed="true" title="Camera follows what Claude is designing">Follow</button>
    <button id="comment-mode" aria-pressed="false" title="Pin a comment on an element (C)">Comment <span id="c-badge" hidden></span></button>
    <button id="open-tokens">Tokens</button>
    <button id="hist">History</button>
    <button id="save" title="Save a named checkpoint">Save version</button>
    <a id="export" class="btn" title="Download this project as a JSON file">Export</a>
    <!-- Shown only while Claude is writing to an artboard (set from app.js) -->
    <button id="live" hidden aria-live="polite"><i aria-hidden="true"></i>Designing <b></b></button>
    <span id="status" class="off">connecting…</span>
  </header>

  <main id="viewport">
    <!-- "world" is the pannable/zoomable layer; artboards live inside it -->
    <div id="world"></div>
  </main>
  <div id="hint" hidden>Empty project.<br>Ask Claude to design something, or click <b>+ Artboard</b>.</div>
  <!-- Selection box lives outside the world so its border stays 2px at any zoom -->
  <div id="sel" hidden></div>
  <div id="agent"></div>
  <!-- Thin box around the layer the pointer is over in the Layers panel -->
  <div id="hover" hidden></div>
  <!-- Comment pins, also outside the world so they keep a constant size -->
  <div id="pins"></div>
  <div id="pop" hidden></div>

  <!-- Left drawer: the layer tree -->
  <aside id="layers" inert aria-label="Layers">
    <div class="panel-head"><b>Layers</b><button class="icon layers-close" aria-label="Close layers">×</button></div>
    <div class="layers-search"><input type="search" placeholder="Search layers" aria-label="Search layers" spellcheck="false" /></div>
    <div class="layers-list" role="tree"></div>
  </aside>

  <!-- Side drawer: comments, activity, versions, tokens -->
  <aside id="panel" inert aria-label="Project panel">
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="design">Design</button>
        <button role="tab" data-tab="comments">Comments</button>
        <button role="tab" data-tab="activity">Activity</button>
        <button role="tab" data-tab="versions">Versions</button>
        <button role="tab" data-tab="theme">Theme</button>
        <button role="tab" data-tab="tokens">Tokens</button>
        <button role="tab" data-tab="mcp">MCP</button>
      </div>
      <button id="panel-close" class="icon" aria-label="Close panel">×</button>
    </div>
    <div class="pane" data-pane="design"></div>
    <div class="pane" data-pane="comments"></div>
    <div class="pane" data-pane="activity"></div>
    <div class="pane" data-pane="versions"></div>
    <div class="pane" data-pane="theme"></div>
    <div class="pane" data-pane="tokens"></div>
    <div class="pane" data-pane="mcp"></div>
  </aside>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
